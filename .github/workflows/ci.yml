name: CI

on:
  push:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install
      - run: bunx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # Matches the Dockerfile's lychee install (same version, amd64 since GitHub-hosted runners
      # are always x86_64) -- without it, wiki-sync's findBrokenLinks tests skip rather than run.
      - name: Install lychee
        run: |
          curl -fsSL "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin --strip-components=1 "lychee-x86_64-unknown-linux-gnu/lychee"
      - run: bun install
      - run: bun test
        env:
          # config.ts requires these at import time; no test actually calls Discord/OpenAI, so
          # dummy values are enough to get past the module-load check.
          DISCORD_BOT_TOKEN: test-token
          OPENAI_API_KEY: test-key

  # The personal web app, installed and built the way the Dockerfile's web-build stage does it. `lint`
  # runs the raw-HTML rule and the bun unit tests; `test:e2e` starts both Playwright servers itself:
  # the app on :4173 and the render harness on :4174.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run build
      # Full Chromium without the headless shell: playwright.config.ts runs the `chromium` channel.
      - run: bunx playwright install --with-deps --no-shell chromium
      - run: bun run test:e2e

  # Builds the image natively per arch (the deploy host is arm64) and drives a real browser in it.
  browser-smoke:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: docker build -t sushii-agent:smoke .
      - run: docker run --rm --init --entrypoint sh sushii-agent:smoke scripts/browser-smoke.sh
      # Workspace target under its production hardening (non-root, no caps, no privilege escalation),
      # through its own entrypoint. docker-build-workspace needs this job, so a failure blocks the push.
      - run: docker build --target workspace -t sushii-agent:smoke-workspace .
      - run: >-
          docker run --rm --init --user 1000:1000 --cap-drop ALL
          --security-opt no-new-privileges --shm-size 1g
          sushii-agent:smoke-workspace sh scripts/browser-smoke.sh

  docker-build:
    needs: [typecheck, test, web, browser-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: sushiibot/sushii-workflows/.github/workflows/docker-build.yml@main # zizmor: ignore[unpinned-uses] first-party, tracked at @main by design
    with:
      image_name: ghcr.io/sushiibot/sushii-agent
    permissions:
      contents: read
      packages: write

  # Workspace image (Dockerfile `workspace` target). The reusable docker-build workflow has no
  # target input, so this builds inline. Pushed as <sha>-workspace.
  docker-build-workspace:
    needs: [typecheck, test, browser-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.version.outputs.short_sha }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set image version
        id: version
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: workspace
          platforms: linux/amd64,linux/arm64
          push: true
          # No :latest -- that tag belongs to the bot image in the same package.
          tags: ghcr.io/sushiibot/sushii-agent:${{ steps.version.outputs.short_sha }}-workspace
          cache-from: |
            type=registry,ref=ghcr.io/sushiibot/sushii-agent:buildcache
            type=registry,ref=ghcr.io/sushiibot/sushii-agent:buildcache-workspace
          cache-to: type=registry,ref=ghcr.io/sushiibot/sushii-agent:buildcache-workspace,mode=max

  deploy:
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: sushiibot/sushii-workflows/.github/workflows/deploy.yml@main # zizmor: ignore[unpinned-uses] first-party, tracked at @main by design
    with:
      service: private-bots/sushii-agent
      image_version: ${{ needs.docker-build.outputs.image_version }}
      host: apps
    secrets:
      ANSIBLE_REPO_TOKEN: ${{ secrets.ANSIBLE_REPO_TOKEN }}
      ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
      ANSIBLE_KNOWN_HOSTS: ${{ secrets.ANSIBLE_KNOWN_HOSTS }}
      ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

  # After the bot: a new workspace may send fields an older bot drops, and the two deploys would
  # otherwise race pushing their tag bumps to sushii-ansible.
  deploy-workspace:
    needs: [deploy, docker-build-workspace]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: sushiibot/sushii-workflows/.github/workflows/deploy.yml@main # zizmor: ignore[unpinned-uses] first-party, tracked at @main by design
    with:
      service: private-bots/sushii-agent-workspace
      image_version: ${{ needs.docker-build-workspace.outputs.short_sha }}
      host: apps
    secrets:
      ANSIBLE_REPO_TOKEN: ${{ secrets.ANSIBLE_REPO_TOKEN }}
      ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
      ANSIBLE_KNOWN_HOSTS: ${{ secrets.ANSIBLE_KNOWN_HOSTS }}
      ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
