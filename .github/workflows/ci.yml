name: CI

on:
  push:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # Matches the Dockerfile's lychee install (same version, amd64 since GitHub-hosted runners
      # are always x86_64) -- without it, wiki-sync's findBrokenLinks tests skip rather than run.
      - name: Install lychee
        run: |
          curl -fsSL "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin --strip-components=1 "lychee-x86_64-unknown-linux-gnu/lychee"
      # Matches the Dockerfile's ripgrep (wiki search); without it those tests skip rather than run.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - run: bun install --frozen-lockfile
      # Keep Git subprocess tests on Bun's established sequential runner within each shard.
      - run: bun run test --shard=${{ matrix.shard }}/2
        env:
          # config.ts requires the OpenAI key at import time; no test calls Discord or OpenAI, so
          # dummy values are enough.
          DISCORD_BOT_TOKEN: test-token
          OPENAI_API_KEY: test-key

  build:
    needs: [typecheck, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: sushiibot/sushii-workflows/.github/workflows/build-verified.yml@20fa6954e3c62b1137519e8790706116c5fffbe9
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: sushiibot/sushii-workflows/.github/workflows/release-auto.yml@0f9f1d0e140398ba9396166269557cdc660507ec
    permissions:
      contents: read
      actions: read
      statuses: write
      id-token: write
      attestations: write
    with:
      target: production
      artifact_digest: ${{ needs.build.outputs.artifact_digest }}
    secrets:
      SUSHII_CI_PRIVATE_KEY: ${{ secrets.SUSHII_CI_PRIVATE_KEY }}
