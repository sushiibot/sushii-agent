name: CI

on:
  push:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # Matches the Dockerfile's lychee install (same version, amd64 since GitHub-hosted runners
      # are always x86_64) -- without it, wiki-sync's findBrokenLinks tests skip rather than run.
      - name: Install lychee
        run: |
          curl -fsSL "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin --strip-components=1 "lychee-x86_64-unknown-linux-gnu/lychee"
      # Matches the Dockerfile's ripgrep (wiki search); without it those tests skip rather than run.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
      - run: bun install --frozen-lockfile
      # Keep Git subprocess tests on Bun's established sequential runner within each shard.
      - run: bun run test --shard=${{ matrix.shard }}/2
        env:
          # config.ts requires the OpenAI key at import time; no test calls Discord or OpenAI, so
          # dummy values are enough.
          DISCORD_BOT_TOKEN: test-token
          OPENAI_API_KEY: test-key

  docker-build:
    needs: [typecheck, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: sushiibot/sushii-workflows/.github/workflows/docker-build.yml@main # zizmor: ignore[unpinned-uses] first-party, tracked at @main by design
    with:
      image_name: ghcr.io/sushiibot/sushii-agent
    permissions:
      contents: read
      packages: write

  deploy:
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # apps deploys on its own (sushii-ansible roles/pull_deploy): this bumps the tag and waits for its
    # status, which is mirrored onto this commit with a Grafana log link.
    permissions:
      statuses: write
    uses: sushiibot/sushii-workflows/.github/workflows/pull-deploy.yml@4246adf846f300a79038cbca1abbc432b720122a # pull-deploy
    with:
      service: private-bots/sushii-agent
      image_version: ${{ needs.docker-build.outputs.image_version }}
      host: apps
    secrets:
      SUSHII_CI_PRIVATE_KEY: ${{ secrets.SUSHII_CI_PRIVATE_KEY }}
